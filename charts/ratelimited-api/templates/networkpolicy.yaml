{{- if .Values.networkPolicy.enabled -}}
{{- $fullname := include "rla.fullname" . -}}
{{- $api := include "rla.selector" (dict "ctx" . "component" "api") -}}
# The API is public-facing: accept HTTP from anywhere in the cluster
# (ingress controller, Prometheus, helm tests).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "rla.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $api | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
{{- range $component, $port := dict "redis" 6379 "postgres" 5432 }}
{{- if (index $.Values $component).enabled }}
---
# {{ $component }} only accepts connections from the API pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "rla.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rla.selector" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $api | nindent 14 }}
      ports:
        - port: {{ $port }}
{{- end }}
{{- end }}
{{- end }}
