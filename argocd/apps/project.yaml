# Restricts what platform apps may deploy and where.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Rate-limited API and its supporting services
  sourceRepos:
    - https://github.com/Salar24/k8s-platform.git
    - https://prometheus-community.github.io/helm-charts
    - https://traefik.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: links-dev
    - server: https://kubernetes.default.svc
      namespace: links-prod
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: traefik
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # Needed by the monitoring and ingress charts.
    - group: rbac.authorization.k8s.io
      kind: "*"
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: networking.k8s.io
      kind: IngressClass
  # Prod may only be synced during business hours (UTC, weekdays).
  syncWindows:
    - kind: allow
      schedule: "0 9 * * 1-5"
      duration: 8h
      applications: ["ratelimited-api-prod"]
      manualSync: true
